services:
  ollama:
    image: ollama/ollama:latest
    container_name: lab-ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-2048}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  lab-vuln:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-vuln
    command: uvicorn lab.apps.vuln:app --host 0.0.0.0 --port 8000
    depends_on:
      - ollama
    environment:
      APP_MODE: vulnerable
      APP_NAME: AI Red Teaming Lab - Vulnerable
      LAB_DB_PATH: /app/data/lab.db
      LAB_SECRETS_FILE: /app/data/secrets.txt
      LAB_SHARED_SECRET: MOCK-VULN-SYSTEM-PROMPT-KEY
      LAB_EMERGENCY_TOKEN: MOCK-VULN-ENV-TOKEN
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-batiai/gemma4-e2b:q4}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-160}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  lab-secure:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-secure
    command: uvicorn lab.apps.secure:app --host 0.0.0.0 --port 8001
    depends_on:
      - ollama
    environment:
      APP_MODE: secure
      APP_NAME: AI Red Teaming Lab - Secure
      LAB_DB_PATH: /app/data/lab.db
      LAB_SECRETS_FILE: /app/data/secrets.txt
      LAB_SHARED_SECRET: MOCK-SECURE-INTERNAL-TOKEN
      LAB_EMERGENCY_TOKEN: MOCK-SECURE-ENV-TOKEN
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-batiai/gemma4-e2b:q4}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-160}
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  ollama-data:
